services:
  api:
    build:
      context: .
      dockerfile: src/MDB.Api/Dockerfile
    ports:
      - "127.0.0.1:5132:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      SeedAdmin__Email: "${MDB_ADMIN_EMAIL:?Set MDB_ADMIN_EMAIL in .env}"
      SeedAdmin__Password: "${MDB_ADMIN_PASSWORD:?Set MDB_ADMIN_PASSWORD in .env}"
      SeedDemo__Password: "${MDB_DEMO_PASSWORD:?Set MDB_DEMO_PASSWORD in .env}"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=MDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - api-keys:/home/app/.aspnet/DataProtection-Keys

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
    ports:
      - "127.0.0.1:14330:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  sqlserver-data:
  api-keys:
